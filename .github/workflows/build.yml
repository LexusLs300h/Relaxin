name: Build Relaxin IPA & TIPA

on:
  push:
    branches: [ ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install brew dependencies
        run: |
          brew install ripgrep dpkg ldid

      - name: Download trustcache binary
        run: |
          curl -L -o trustcache https://github.com/CRKatri/trustcache/releases/download/v2.0/trustcache_macos_arm64
          chmod +x trustcache
          sudo mv trustcache /usr/local/bin/

      - name: Build with Makefile
        run: make

      - name: Package IPA and TIPA
        run: |
          mkdir -p Payload
          BUILD_DIR=$(xcodebuild -showBuildSettings | grep "BUILT_PRODUCTS_DIR" | head -1 | sed -E 's/.* = //')
          APP_PATH="${BUILD_DIR}/Relaxin.app"
          echo "Found Relaxin.app at $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Relaxin.app not found at $APP_PATH"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Relaxin.ipa Payload
          cp Relaxin.ipa Relaxin.tipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-IPA
          path: Relaxin.ipa

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-TIPA
          path: Relaxin.tipa
