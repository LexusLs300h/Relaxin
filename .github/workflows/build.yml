name: Build Relaxin IPA & TIPA

on:
  push:
    branches: [ ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install brew dependencies
        run: |
          brew install ripgrep dpkg ldid

      - name: Download trustcache binary
        run: |
          curl -L -o trustcache https://github.com/CRKatri/trustcache/releases/download/v2.0/trustcache_macos_arm64
          chmod +x trustcache
          sudo mv trustcache /usr/local/bin/


      - name: Cache Relaxin build resources
        uses: actions/cache@v4
        with:
          path: |
            build/BootstrapSources
            build/BootstrapResources
            build/Relaxin054Resources
            build/BaseBinResources
          key: relaxin-build-resources-v0.5.4-${{ runner.os }}-${{ hashFiles('DevKit/Helpers/download-bootstrap.sh', 'DevKit/Helpers/prepare-v054-resources.sh', 'Makefile') }}
          restore-keys: |
            relaxin-build-resources-v0.5.4-${{ runner.os }}-

      - name: Build + Generate IPA & TIPA (use Make native target)
        run: |
          make ipa tipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-IPA
          path: build/Artifacts/*.ipa

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-TIPA
          path: build/Artifacts/*.tipa
