name: Build Relaxin IPA & TIPA

on:
  push:
    branches: [ ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install brew dependencies
        run: |
          brew install ripgrep dpkg ldid

      - name: Download trustcache binary
        run: |
          curl -L -o trustcache https://github.com/CRKatri/trustcache/releases/download/v2.0/trustcache_macos_arm64
          chmod +x trustcache
          sudo mv trustcache /usr/local/bin/

      - name: Build + Generate IPA & TIPA (use Make native target)
        run: |
          make ipa tipa

      - name: Persist bumped build version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configuration/Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump Relaxin build version [skip ci]"
            git push origin HEAD:ui
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-IPA
          path: build/Artifacts/*.ipa

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-TIPA
          path: build/Artifacts/*.tipa
